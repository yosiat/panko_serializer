# We want Exclude directives from different
# config files to get merged, not overwritten
inherit_mode:
  merge:
    - Exclude

require:
  - standard

plugins:
  - rubocop-performance
  - standard-performance
  - rubocop-rspec

inherit_gem:
  standard: config/base.yml
  standard-performance: config/base.yml

AllCops:
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  NewCops: disable
  Exclude:
    - gemfiles/**/*
    # Generated Class snapshot fixtures are byte-exact Generator output —
    # linting/auto-correcting them would break the snapshot-match contract.
    - spec/code_gen/fixtures/generated/**/*
    # Research/experiment scripts (inherited from serializers-code-gen, which
    # ignored docs/research/**); not part of the shipped surface.
    - docs/code_gen/research/**/*


Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always
  SafeAutoCorrect: true

# TODO: need to work on specs.
RSpec:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Exclude:
    - spec/**/*
